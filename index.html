<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 微信分享标题 / 描述：可按需修改 -->
  <meta name="description" content="选出你认为最完美的一张图片，赢取专属礼物">
  <title>选出最完美的图片 · 赢礼物</title>
  <style>
    /* ========== 适配：以 375 设计稿为基准，320–428 舒适显示 ========== */
    html {
      font-size: 4.26667vw; /* 375px → 16px */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    @media (min-width: 428px) {
      html { font-size: 18.26px; }
    }
    @media (max-width: 320px) {
      html { font-size: 13.65px; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: linear-gradient(180deg, #fff6ea 0%, #ffe4ec 42%, #fff1c9 100%);
      color: #6b3a3a;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* 柔和光斑背景，增强礼物氛围 */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-glow span {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.55;
    }
    .bg-glow .g1 { width: 14rem; height: 14rem; background: #ffd1dc; top: -4rem; left: -3rem; }
    .bg-glow .g2 { width: 12rem; height: 12rem; background: #ffe9a8; top: 8rem; right: -4rem; }
    .bg-glow .g3 { width: 10rem; height: 10rem; background: #ffc9b5; bottom: 2rem; left: 20%; }

    .app {
      position: relative;
      z-index: 1;
      max-width: 428px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 1.25rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    }

    .page { display: none; animation: pageIn 0.45s ease; }
    .page.active { display: block; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(0.6rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 通用按压反馈 */
    .pressable {
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .pressable:active { transform: scale(0.96); filter: brightness(0.96); }

    /* ========== 首页 ========== */
    .home-header {
      text-align: center;
      padding: 0.6rem 0.4rem 1.1rem;
    }
    .sparkle-row {
      font-size: 1.15rem;
      letter-spacing: 0.35rem;
      margin-bottom: 0.45rem;
      animation: twinkle 1.6s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .home-header h1 {
      font-size: 1.35rem;
      line-height: 1.45;
      font-weight: 700;
      color: #8a3b4a;
      text-shadow: 0 1px 0 #fff;
    }
    .home-sub {
      margin-top: 0.45rem;
      font-size: 0.82rem;
      color: #c0787a;
    }

    .pic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    /* 图片选项卡片：后续把 .pic-ph 换成 <img> 即可 */
    .pic-card {
      background: #fff;
      border: none;
      border-radius: 1.05rem;
      padding: 0.45rem;
      box-shadow: 0 0.45rem 1.2rem rgba(196, 92, 110, 0.16);
      display: flex;
      flex-direction: column;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .pic-card:active { box-shadow: 0 0.2rem 0.6rem rgba(196, 92, 110, 0.18); }

    .pic-ph {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #f4d0d6;
    }
    .pic-ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }
    .pic-4 img { object-position: center 40%; }
    .pic-caption {
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #9a4d58;
      padding: 0.5rem 0 0.2rem;
    }

    /* 四张占位图用不同暖色，方便区分 */
    .pic-1 { background: linear-gradient(145deg, #ffb6c8, #ff8fab); }
    .pic-2 { background: linear-gradient(145deg, #ffd29d, #ffb347); }
    .pic-3 { background: linear-gradient(145deg, #ffe6a7, #f5c518); }
    .pic-4 { background: linear-gradient(145deg, #ffc4b8, #ff8a75); }

    /* ========== 过渡页：答对了 ========== */
    .success-wrap {
      min-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 1rem 0.5rem;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti {
      position: absolute;
      top: -0.6rem;
      width: 0.5rem;
      height: 0.9rem;
      border-radius: 2px;
      animation: fall linear forwards;
      opacity: 0.9;
    }
    .confetti.dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; }
    .confetti.star-shape {
      width: 0.7rem;
      height: 0.7rem;
      background: none !important;
      font-size: 0.7rem;
      line-height: 1;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(28rem) rotate(540deg); opacity: 0.15; }
    }

    .success-stars {
      font-size: 1.4rem;
      letter-spacing: 0.5rem;
      margin-bottom: 0.6rem;
      animation: starPulse 1.2s ease-in-out infinite;
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .success-title {
      font-size: 2.15rem;
      font-weight: 800;
      color: #d4a017;
      text-shadow: 0 2px 0 #fff6c8, 0 8px 20px rgba(212, 160, 23, 0.28);
      animation: popIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .success-hint {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      color: #c0787a;
    }

    .btn-gift {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-width: 12rem;
      padding: 0.85rem 1.6rem;
      border: none;
      border-radius: 999px;
      font-size: 1.02rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff8fab 0%, #ff6b81 55%, #f5b942 100%);
      box-shadow: 0 0.55rem 1.4rem rgba(255, 107, 129, 0.38);
      opacity: 0;
      transform: translateY(0.6rem);
      pointer-events: none;
    }
    .btn-gift.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      animation: btnShow 0.45s ease forwards, btnGlow 2.2s ease-in-out 0.45s infinite;
    }
    @keyframes btnShow {
      from { opacity: 0; transform: translateY(0.6rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0.55rem 1.4rem rgba(255, 107, 129, 0.38); }
      50% { box-shadow: 0 0.7rem 1.8rem rgba(245, 185, 66, 0.5); }
    }
    .btn-gift:active { box-shadow: 0 0.25rem 0.7rem rgba(255, 107, 129, 0.3); }

    /* ========== 礼物展示页 ========== */
    .gift-header {
      text-align: center;
      margin-bottom: 1rem;
    }
    .gift-header h2 {
      font-size: 1.2rem;
      color: #8a3b4a;
    }
    .gift-header p {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: #c0787a;
    }

    .letter-card {
      background: #fffdf8;
      border-radius: 1.35rem;
      padding: 1.8rem 1.15rem 1.5rem;
      box-shadow: 0 0.65rem 1.6rem rgba(196, 92, 110, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      margin-bottom: 1.15rem;
      border: 1px solid rgba(245, 185, 66, 0.32);
    }
    .envelope {
      width: 7.2rem;
      height: 5.4rem;
      position: relative;
      flex-shrink: 0;
    }
    .envelope .flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2.9rem;
      background: linear-gradient(180deg, #ffd6de, #ffb3c1);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      z-index: 2;
    }
    .envelope .body {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3.7rem;
      background: linear-gradient(180deg, #fff 0%, #ffe8ee 100%);
      border: 3px solid #ffb3c1;
      border-radius: 0 0 0.5rem 0.5rem;
    }
    .envelope .seal {
      position: absolute;
      left: 50%;
      top: 2.15rem;
      transform: translateX(-50%);
      width: 1.15rem;
      height: 1.15rem;
      background: #e85d75;
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 0 0 3px #fff;
    }
    .letter-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: #8a3b4a;
    }
    .letter-sub {
      font-size: 0.88rem;
      color: #c0787a;
      margin-top: 0.25rem;
    }

    .blessing-card {
      background: #fffdf8;
      border-radius: 1.1rem;
      padding: 1.25rem 1.15rem 1.55rem;
      box-shadow: 0 0.45rem 1.2rem rgba(196, 92, 110, 0.12);
      text-align: center;
      border: 1px dashed rgba(232, 93, 117, 0.28);
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .blessing-label {
      font-size: 0.75rem;
      color: #c0787a;
      letter-spacing: 0.12em;
      margin-bottom: 0.7rem;
    }
    .blessing-text {
      font-size: 0.92rem;
      line-height: 1.9;
      color: #8a3b4a;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      width: 100%;
      max-width: 100%;
      text-align: left;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <span class="g1"></span>
    <span class="g2"></span>
    <span class="g3"></span>
  </div>

  <div class="app">
    <!-- ========== 第 1 页：选图首页 ========== -->
    <section id="page-home" class="page active" aria-label="选图首页">
      <header class="home-header">
        <div class="sparkle-row" aria-hidden="true">✨ 🎁 ✨</div>
        <!-- 首页标题：可直接改这里的文字 -->
        <h1>选出你认为最完美的一张图片</h1>
        <p class="home-sub">点选一张，马上揭晓惊喜</p>
      </header>

      <div class="pic-grid">
        <button type="button" class="pic-card pressable" data-choice="1" aria-label="选择图片1">
          <div class="pic-ph pic-1">
            <img src="images/pic1.jpg" alt="图片1">
          </div>
          <span class="pic-caption">图片1</span>
        </button>
        <button type="button" class="pic-card pressable" data-choice="2" aria-label="选择图片2">
          <div class="pic-ph pic-2">
            <img src="images/pic2.jpg" alt="图片2">
          </div>
          <span class="pic-caption">图片2</span>
        </button>
        <button type="button" class="pic-card pressable" data-choice="3" aria-label="选择图片3">
          <div class="pic-ph pic-3">
            <img src="images/pic3.jpg" alt="图片3">
          </div>
          <span class="pic-caption">图片3</span>
        </button>
        <button type="button" class="pic-card pressable" data-choice="4" aria-label="选择图片4">
          <div class="pic-ph pic-4">
            <img src="images/pic4.jpg" alt="图片4">
          </div>
          <span class="pic-caption">图片4</span>
        </button>
      </div>
    </section>

    <!-- ========== 第 2 页：答对了过渡页 ========== -->
    <section id="page-success" class="page" aria-label="答对了">
      <div class="success-wrap">
        <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
        <div class="success-stars" aria-hidden="true">⭐ ✨ ⭐</div>
        <!-- 过渡页文案 -->
        <h1 class="success-title">答对了！</h1>
        <p class="success-hint">每一张都是完美的选择</p>
        <button type="button" class="btn-gift pressable" id="btnViewGift">🎁 查看我的礼物</button>
      </div>
    </section>

    <!-- ========== 第 3 页：礼物展示 ========== -->
    <section id="page-gift" class="page" aria-label="礼物展示">
      <header class="gift-header">
        <h2>专属于你的惊喜</h2>
        <p>有一封信要给你</p>
      </header>

      <!-- 信：放大后的主视觉 -->
      <div class="letter-card">
        <div class="envelope" aria-hidden="true">
          <div class="body"></div>
          <div class="flap"></div>
          <div class="seal"></div>
        </div>
        <div>
          <div class="letter-text">💌 一封写给你的信</div>
          <div class="letter-sub">轻轻拆开，里面是心意</div>
        </div>
      </div>

      <!-- 祝福语：改下面 CONFIG.blessing 即可 -->
      <div class="blessing-card">
        <div class="blessing-label">✦ 祝福语 ✦</div>
        <p class="blessing-text" id="blessingText">亲爱的我给你写了一封信，
真正生日那天记得查收哦

礼物我还在选，
有什么想要的记得告诉我，
到英国之后再给你几个选项，
之后送给你

我爱你卢意</p>
      </div>
    </section>
  </div>

  <script>
    /* =========================================================
     * 可修改配置（文案 / 祝福语 / 动画时间）
     * ========================================================= */
    var CONFIG = {
      blessing: '亲爱的我给你写了一封信，\n真正生日那天记得查收哦\n\n礼物我还在选，\n有什么想要的记得告诉我，\n到英国之后再给你几个选项，\n之后送给你\n\n我爱你卢意',
      giftButtonDelay: 1500      // 过渡页按钮延迟出现（毫秒）
    };

    /* 启用 iOS :active 按压反馈 */
    document.addEventListener('touchstart', function () {}, { passive: true });

    var pages = {
      home: document.getElementById('page-home'),
      success: document.getElementById('page-success'),
      gift: document.getElementById('page-gift')
    };
    var btnViewGift = document.getElementById('btnViewGift');
    var confettiLayer = document.getElementById('confettiLayer');
    var blessingText = document.getElementById('blessingText');
    var giftBtnTimer = null;

    blessingText.textContent = CONFIG.blessing;

    function showPage(name) {
      Object.keys(pages).forEach(function (key) {
        pages[key].classList.remove('active');
      });
      /* 重新触发入场动画 */
      void pages[name].offsetWidth;
      pages[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    /* 无论点哪张图，都进入「答对了」页，没有错误反馈 */
    document.querySelectorAll('.pic-card').forEach(function (card) {
      card.addEventListener('click', function () {
        enterSuccessPage();
      });
    });

    function enterSuccessPage() {
      btnViewGift.classList.remove('show');
      spawnConfetti();
      showPage('success');
      clearTimeout(giftBtnTimer);
      giftBtnTimer = setTimeout(function () {
        btnViewGift.classList.add('show');
      }, CONFIG.giftButtonDelay);
    }

    btnViewGift.addEventListener('click', function () {
      showPage('gift');
    });

    /* 彩带 / 星星庆祝动画（纯 DOM + CSS，不依赖外部资源） */
    function spawnConfetti() {
      confettiLayer.innerHTML = '';
      var colors = ['#ff6b81', '#f5b942', '#ff8fab', '#fff3b0', '#e85d75', '#ffd6a5', '#ffffff'];
      var count = 36;
      for (var i = 0; i < count; i++) {
        var el = document.createElement('span');
        var isStar = i % 7 === 0;
        el.className = 'confetti' + (isStar ? ' star-shape' : (i % 4 === 0 ? ' dot' : ''));
        el.style.left = (Math.random() * 100) + '%';
        el.style.background = colors[i % colors.length];
        el.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
        el.style.animationDelay = (Math.random() * 0.7) + 's';
        el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
        if (isStar) el.textContent = '✦';
        confettiLayer.appendChild(el);
      }
    }
  </script>
</body>
</html>
